name: CI

# Maith CI — the build oracle + integrity gates.
#
# Protocol ported from PleaNP (2026-09-15). Two jobs, mirroring the two trust
# boundaries PleaNP separates:
#
#   1. Lean build + test suite  — the kernel is the oracle for *proofs/code*.
#   2. Integrity gates (Tier 1) — for *statements and definitions* that the
#      kernel cannot audit: no sorry/admit/axiom, no vacuous bodies, no inert
#      binders. See docs/TOOLCHAIN_AND_CI.md.
#
# Runs on main. A green check here means "the code
# builds, the tests pass, and the Tier-1 mechanical checks are clean" — it is
# necessary, not sufficient, for a validated claim (Tier 2 is the local
# agent's `#print axioms` step; the semantic step is human review).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lean:
    name: Lean build + test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (checksum-pinned)
        # No curl|sh: tooling/install_elan.sh downloads a tagged release asset
        # and verifies its SHA-256 before running it (#82).
        run: |
          tooling/install_elan.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install pinned Lean toolchain
        run: lean --version

      - name: Restore Mathlib olean cache (community Azure cache)
        run: lake exe cache get

      - name: Build test target
        run: lake build tests

      # Hard gate since #25: the harness now exits non-zero on any unexpected
      # failure. Pre-existing failures are listed explicitly in
      # Tests.Harness.knownFailures (with their tracking notes) and are reported
      # as SKIP; anything else fails the build. This replaces the previous
      # grep-the-output workaround, which could not distinguish a clean run from
      # a broken one.
      #
      # Run under `lake env` so the `lean` binary the decompiler validity test
      # shells out to is on PATH.
      - name: Run Lean test suite
        run: lake env ./.lake/build/bin/tests

      # #29: the five-gate harness. It discharges REAL Lean obligations via
      # `lake env lean`, so it belongs in the Lean job, not the Python one.
      # It skips gate-executing tests cleanly when `lake` is absent, so this is
      # safe either way -- but here the toolchain is present and warm.
      - name: Five-gate harness tests (#29)
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          python3 axiom-rewrite/test_harness.py

  gates:
    name: Integrity gates (Tier 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hygiene scan (Gate 6 Tier 1 — no sorry/admit/axiom)
        run: python3 tooling/gates/hygiene_scan.py --prove-stage Maith Tests Scripts

      - name: Vacuity scan (Gate 5 Tier 1 — no dishonest placeholders)
        run: python3 tooling/gates/vacuity_scan.py Maith Tests Scripts

      # Blocking since #38. Gate 5 Tier 1b catches non-load-bearing binders (the
      # "a parameter that is never used" integrity hole). It was advisory while one
      # pre-existing dead helper (runEnvTest, unused `env`) remained; that helper is
      # removed, so the scan is clean (0 violations) and a NEW violation now fails
      # CI instead of going green. The 34 REVIEW items are advisory and do not fail
      # (deliberately not `--strict`; see #38's scope boundary).
      - name: Binder-usage / lethality scan (Gate 5 Tier 1b)
        run: |
          python3 tooling/gates/binder_usage_scan.py \
            --allow-unreferenced '^(run(All|Env|Graph)?[A-Za-z]*|main)$' \
            Maith Tests Scripts

      - name: Gate-scanner self-tests (must detect the planted cases)
        run: |
          set -e
          python3 tooling/gates/hygiene_scan.py --prove-stage tooling/gates/tests/case2_real_sorry.lean \
            && { echo "ERROR: real sorry not detected"; exit 1; } || echo "case2 detected ok"
          python3 tooling/gates/hygiene_scan.py --prove-stage tooling/gates/tests/case3_axiom.lean \
            && { echo "ERROR: custom axiom not detected"; exit 1; } || echo "case3 detected ok"
          python3 tooling/gates/hygiene_scan.py --prove-stage tooling/gates/tests/case5_clean.lean \
            && echo "case5 clean ok" || { echo "ERROR: clean case flagged"; exit 1; }
          python3 tooling/gates/vacuity_scan.py tooling/gates/tests/case1_placeholder.lean >/dev/null \
            && echo "vacuity clean ok" || { echo "ERROR: vacuity false positive"; exit 1; }
          python3 tooling/gates/binder_usage_scan.py tooling/gates/tests/case8_unused_param.lean \
            && { echo "ERROR: unused param not detected"; exit 1; } || echo "case8 detected ok"

  python:
    name: Python tests (stdlib-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The torch/transformers-dependent tests are excluded: they need the ML
      # stack and (for some) a built corpus. This job covers the pure-stdlib
      # invariant/schema/bucketing tests, which are exactly the ones that
      # guard the pipeline's data contract. See docs/TOOLCHAIN_AND_CI.md.
      - name: Run stdlib-only test suite
        run: |
          set -e
          for t in \
            test_build_dataset_v2 \
            test_c4_bucketing \
            test_c4_consistency \
            test_corpus_expansion_config \
            test_eval_checkpoint_guard \
            test_eval_completion_authoritative \
            test_h5_pairs \
            test_invariants ; do
            echo "::group::$t"
            python3 "python/$t.py"
            echo "::endgroup::"
          done

      # The dashboard's own tooling tests. They were not wired into CI before,
      # and that is how a stale assertion (asserting `trl` absent while reading
      # the repo root, where status/trl.json exists) sat red unnoticed. The
      # status-log contract is what the HuB tab depends on, so it is guarded
      # here rather than left to a manual run.
      - name: HuB tooling tests (sweep + auditor)
        run: |
          set -e
          python3 tooling/tests/test_hub_sweep.py
          python3 tooling/tests/test_auditor.py

      # #36: the mutation guards mutate a real source file and restore it. This
      # pins that restore AND bytecode purge happen on every exit path, including
      # a mid-guard crash -- without it, a stale mutated .pyc corrupts a later
      # process (it once truncated the candidate ledger). Runs FIRST, so a stale
      # cache cannot contaminate the guards below.
      - name: Mutation guards restore cleanly and leave no stale bytecode (#36)
        run: python3 tooling/test_mutation_guard_lib.py

      # A test that passes on a broken checker is not a test. This mutates
      # check_invariants.py (one declared constraint at a time), asserts the
      # invariant-5 fixtures DETECT each mutation, and restores the file.
      # Guards against the #22 failure mode recurring.
      - name: Invariant fixtures are not vacuous (mutation check)
        run: python3 python/test_mutation_guard.py

      # Invariants 8 (grammar/arity) + 9 (C1 polarity) — issue #23. Their guard
      # distinguishes DETECTED / REDUNDANT / GAP so a redundant check is not
      # reported as a failure and a real hole cannot hide behind one.
      - name: Encoder-format invariants are not vacuous (mutation check)
        run: python3 python/test_invariants_8_9_guard.py

      # Axiom-discovery ledger + coverage map (#27). The validation rules that
      # keep compression/reusable honest are themselves mutation-tested.
      - name: Candidate ledger tests
        run: python3 axiom-rewrite/test_candidates.py

      - name: Candidate ledger validation not vacuous (mutation check)
        run: python3 axiom-rewrite/test_mutation_guard.py

      # #24: manage.py gate/invariants path resolution. Pins that a relative
      # --datasets resolves against REPO (not the caller's cwd), that a missing
      # dir fails early, and that the gate header shows the resolved tree.
      - name: Gate path resolution tests
        run: python3 python/test_manage_gate_paths.py

      - name: Gate path resolution not vacuous (mutation check)
        run: python3 python/test_manage_gate_paths_guard.py

      # #28 phase 1: structural similarity over IR graphs. The real-corpus tests
      # SKIP when Corpus/corpus.jsonl is absent (it is gitignored); the synthetic
      # tests and the mutation guard always run.
      - name: Structural similarity tests
        run: python3 python/test_structural_similarity.py

      - name: Structural similarity not vacuous (mutation check)
        run: python3 python/test_structural_similarity_guard.py

      # #35 (python half): the gate's missing-corpus message names what IS present
      # and its mode, instead of implying nothing is there.
      - name: Missing-corpus diagnostic tests
        run: python3 python/test_ir_build_missing_corpus.py

      # #35 (the fix): the Lean builder's mode->filename mapping and the Python
      # consumers' read defaults must agree — the mismatch IS the bug. Binds the
      # Lean source to the Python defaults so editing one side fails here.
      - name: Corpus filename contract (Lean<->Python)
        run: python3 python/test_corpus_filename_contract.py
      # The auditor and hub-sweep suites. These live in tooling/ rather than
      # python/ because they run against this repo's own tree, and they were
      # never executed by CI -- so a broken check would have reported "no
      # findings" and been indistinguishable from a clean repo. The daily
      # auditor workflow would then have kept passing while auditing nothing.
      - name: Auditor tests
        run: python3 tooling/tests/test_auditor.py

      - name: Hub-sweep tests
        run: python3 tooling/tests/test_hub_sweep.py

      # A test that only passes from the repo root is not a test: the outcome
      # would depend on the caller's cwd rather than on the code. This bit
      # test_hub_sweep.py, which passed from /tmp and failed from the repo root
      # because it passed Path(".") where a tmp_path belonged.
      - name: Auditor/hub-sweep suites are cwd-independent
        run: |
          set -e
          cd /tmp
          python3 "$GITHUB_WORKSPACE/tooling/tests/test_auditor.py"
          python3 "$GITHUB_WORKSPACE/tooling/tests/test_hub_sweep.py"

      # The auditor's own tests must be able to fail, and for the right reason.
      # If a check were silently broken the suite would pass and the daily audit
      # would report a clean repo. Blinds the secret scanner in a copy of the
      # tree (never in place) and requires the tests that constrain it to fire.
      - name: Auditor tests are not vacuous (mutation check)
        run: |
          set -e
          MUT=$(mktemp -d)
          trap 'rm -rf "$MUT"' EXIT
          cp -r "$GITHUB_WORKSPACE"/. "$MUT"/
          cd "$MUT"
          python3 - <<'PY'
          import ast, pathlib, sys
          p = pathlib.Path("tooling/auditor.py")
          src = p.read_text()
          old = r'r"-----BEGIN (?:RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----"'
          if old not in src:
              sys.exit("could not locate the private-key pattern to mutate")
          mutated = src.replace(old, r'r"(?!x)x"', 1)
          if mutated == src:
              sys.exit("mutation was a no-op")
          ast.parse(mutated)   # a mutation that cannot import proves nothing
          p.write_text(mutated)
          PY
          if python3 tooling/tests/test_auditor.py > /tmp/mutated.log 2>&1; then
            echo "::error::the auditor suite passed with the secret scanner blinded"
            tail -20 /tmp/mutated.log
            exit 1
          fi
          grep -q "test_private_key_block_is_reported" /tmp/mutated.log || {
            echo "::error::failed, but not on the test that constrains the mutation"
            tail -20 /tmp/mutated.log
            exit 1
          }
          echo "auditor suite correctly failed on the blinded-scanner tests"
